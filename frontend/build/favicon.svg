<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hactoGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1677FF" />
      <stop offset="100%" stopColor="#0EA5E9" />
    </linearGradient>
    <linearGradient id="hactoGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#34D399" />
    </linearGradient>
    <linearGradient id="hactoGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B1F2A" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container for high contrast in browser tab -->
  <rect width="100" height="100" rx="22" fill="#0B132B" />

  <!-- Base Grid Pillars with Rounded Geometry -->
  <rect x="14" y="16" width="30" height="30" rx="8" fill="url(#hactoGradDark)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
  <rect x="56" y="16" width="30" height="30" rx="8" fill="url(#hactoGradBlue)" />
  <rect x="14" y="54" width="30" height="30" rx="8" fill="url(#hactoGradGreen)" />
  <rect x="56" y="54" width="30" height="30" rx="8" fill="url(#hactoGradBlue)" />

  <!-- Fluent Intersecting Bridge Wave -->
  <path
    d="M28 48 C 40 48, 48 38, 54 28 C 62 42, 70 48, 80 48"
    stroke="#FFFFFF"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Pulsing AI Energy Dot -->
  <circle cx="54" cy="28" r="4.5" fill="#34D399" />
</svg>
