    <script>
        (function() {
            let progress = 0;
            const bar = document.getElementById("splash-progress");
            const status = document.getElementById("splash-status");
            const splash = document.getElementById("splash-screen");

            const messages = [
                "Iniciando ambiente seguro...",
                "Carregando módulos de atendimento...",
                "Sincronizando canais e IA...",
                "Pronto para conectar!"
            ];

            let msgIndex = 0;

            const interval = setInterval(() => {
                if (progress < 40) {
                    progress += 14;
                } else if (progress < 75) {
                    progress += 8;
                    if (msgIndex === 0) {
                        msgIndex = 1;
                        if (status) status.innerText = messages[1];
                    }
                } else if (progress < 92) {
                    progress += 4;
                    if (msgIndex === 1) {
                        msgIndex = 2;
                        if (status) status.innerText = messages[2];
                    }
                } else {
                    progress += (100 - progress) / 6;
                }

                if (bar) bar.style.width = Math.min(progress, 100) + "%";

                if (progress >= 100) {
                    clearInterval(interval);
                    if (status) status.innerText = messages[3];
                    setTimeout(() => {
                        if (splash) {
                            splash.classList.add("fade-out");
                            setTimeout(() => {
                                splash.remove();
                            }, 500);
                        }
                    }, 250);
                }
            }, 300);

            window.finishProgress = function() {
                progress = 100;
                if (bar) bar.style.width = "100%";
                setTimeout(() => {
                    if (splash) {
                        splash.classList.add("fade-out");
                        setTimeout(() => splash.remove(), 500);
                    }
                }, 150);
            };
        })();
    </script>
